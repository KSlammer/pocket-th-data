name: check
on:
  push:
  pull_request:
jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Fails on untranslated text or a translation that drops/adds a {n} number slot.
      - run: npm test
      # data/ must be rebuilt and committed together with i18n/th.json.
      - run: npm run build && git diff --exit-code -- data/
