name: update
# Every 6 h: pull the newest card data, machine-translate anything new, rebuild, push to main.
# Needs the ANTHROPIC_API_KEY repository secret. If tests still fail, the result goes to the auto-update branch instead.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --save-exact pokemon-tcg-pocket-cards@latest
      - run: npm run build
      - name: Translate new text
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$(node -p "const m=require('./i18n/missing.json');m.names.length+m.text.length")" != 0 ]; then
            npm run translate || true
            npm run build
          fi
      - name: Commit
        run: |
          git diff --quiet && { echo "No changes"; exit 0; }
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update card data ($(node -p "require('./package.json').devDependencies['pokemon-tcg-pocket-cards']"))"
          if npm test; then git push origin HEAD:main; else git push -f origin HEAD:auto-update; exit 1; fi
